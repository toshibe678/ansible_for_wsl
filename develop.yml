---
# develop 関連の設定は develop-setting（develop_setting role）に集約している。WSL は workstation プロファイル（全グループ有効）で適用する
- hosts: all
  become: true
  gather_facts: true
  become_user: root
  vars:
    develop_setting_profile: workstation
    develop_setting_windows_from_wsl_enabled: true
    develop_setting_windows_from_wsl_mount_dir: "{{ wsl_mount_dir }}"
    develop_setting_windows_user_name: "{{ win_user_name }}"
    # クラウド認証設定（Vault 暗号化ファイルの絶対パスを渡す。role は中身を読まない）
    develop_setting_aws_config_src: "{{ playbook_dir }}/templates/home/.aws/config"
    develop_setting_ssh_private_key_src: "{{ playbook_dir }}/files/id_ed25519"
    # OpenCode（LiteLLM 経由）。モデル一覧は infra/service/llm-proxy/config/config.yaml の model_name と一致させる
    # 接続先 URL は仮定で未確認。context / output は保守的な仮置き。既定モデルと小型モデルは実測後に差し替える
    develop_setting_opencode_base_url: "https://llm-proxy.abe365.org/v1"
    develop_setting_opencode_models:
      - { id: rtx5070ti-qwen3-coder-30b, name: "Qwen3 Coder 30B", context: 32768, output: 8192 }
      - { id: rtx5070ti-gemma4-12b, name: "Gemma 4 12B", context: 32768, output: 8192 }
      - { id: rtx5070ti-qwen3-8b, name: "Qwen3 8B", context: 32768, output: 8192 }
      - { id: rtx5070ti-deepseek-r1-8b, name: "DeepSeek R1 8B", context: 32768, output: 8192 }
    develop_setting_opencode_default_model: rtx5070ti-qwen3-coder-30b
    develop_setting_opencode_small_model: rtx5070ti-qwen3-8b
    # LiteLLM の専用キー（LITELLM_API_KEY=<キー> の 1 行を Vault 暗号化した、人間が作るファイル。コミットしない平文は置かない）
    develop_setting_opencode_api_key_src: "{{ playbook_dir }}/templates/home/.config/opencode/litellm.env"
    # .gitconfig の safe.directory（git config --add は使わない）
    develop_setting_git_safe_directories:
      - "/home/{{ user_name }}/git/scripts"
      - "/home/{{ user_name }}/git/infra"
      - "/home/{{ user_name }}/git/blog.toshi.click"
      - "/home/{{ user_name }}/git/CurriculumVitae"
      - "/home/{{ user_name }}/git/ansible_for_wsl"
      - "/home/{{ user_name }}/git/develop"
  roles:
    - role: develop_setting
