---
- hosts: all
  become: no
  tasks:
    - name: "create {{ user_name }} ~/git directory"
      file:
        path: "/home/{{ user_name }}/git"
        state: directory

    - name: Clone or update develop-setting repository
      become: yes
      become_user: "{{ user_name }}"
      ansible.builtin.git:
        repo: "{{ develop_setting_repo_url }}"
        dest: "{{ develop_setting_local_repo_dir }}"
        clone: yes
        update: yes

    - name: "create {{ win_user_name }} .ssh/ dicrectory"
      file:
        path: "{{ wsl_mount_dir }}c/Users/{{ win_user_name }}/.ssh"
        state: directory

    - name: "put {{ wsl_mount_dir }}c/Users/{{ win_user_name }}/.ssh/config"
      template:
        src: win/.ssh/config
        dest: "{{ wsl_mount_dir }}c/Users/{{ win_user_name }}/.ssh/config"
        backup: true

    - name: "put {{ wsl_mount_dir }}c/Users/{{ win_user_name }}/.ssh/config"
      template:
        src: win/.ssh/config
        dest: "{{ wsl_mount_dir }}c/Users/{{ win_user_name }}/.ssh/config"
        backup: true

    - name: "put win {{ wsl_mount_dir }}c/Users/{{ win_user_name }}/.gitconfig"
      template:
        src: win/.gitconfig.j2
        dest: "{{ wsl_mount_dir }}c/Users/{{ win_user_name }}/.gitconfig"
        backup: true

    - name: "put win {{ wsl_mount_dir }}c/Users/{{ win_user_name }}/.gitconfig"
      template:
        src: win/.gitignore_global
        dest: "{{ wsl_mount_dir }}c/Users/{{ win_user_name }}/.gitignore_global"
        backup: true

    # Windows側の .claude 設定は develop-setting (windows_from_wsl.yml) で適用する
