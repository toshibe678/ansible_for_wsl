---
# WSL 固有の設定だけを持つ（ロケール、タイムゾーン、sudoers）。
# 開発言語・ツール・共通CLI・ホーム直下の設定・個人リポジトリの clone などの develop 関連は develop-setting（develop.yml が呼ぶ）に集約した
- hosts: all
  become: true
  become_user: root
  tasks:
    - name: "Generate ja_JP.UTF-8 locale"
      locale_gen:
        name: ja_JP.UTF-8
        state: present

    # update-locale と同じ結果（/etc/default/locale の LANG）を冪等に書く
    - name: "set-locale"
      ansible.builtin.lineinfile:
        path: /etc/default/locale
        regexp: '^LANG='
        line: LANG=ja_JP.UTF-8
        create: true
        mode: '0644'

    - name: Set timezone to Asia/Tokyo
      file:
        src: /usr/share/zoneinfo/Asia/Tokyo
        path: /etc/localtime
        state: link
        force: yes
      notify:
        - update timezone

    - name: "put /etc/sudoers.d/{{ sudo_user_name }}"
      template:
        src: etc/sudoers.d/user_sudo
        dest: "/etc/sudoers.d/{{ sudo_user_name }}"
        owner: root
        group: root
        mode: 0440
        backup: true

  handlers:
    - name: update timezone
      ansible.builtin.command: dpkg-reconfigure -f noninteractive tzdata
      changed_when: true
